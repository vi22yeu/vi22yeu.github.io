<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website của tôi</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #111827;
    color: white;
    padding: 14px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.menu-button {
    border: none;
    background: #374151;
    color: white;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
}

/* =========================
   MENU
========================= */

nav {
    display: none;
    background: #1f2937;
}

nav.active {
    display: block;
}

nav a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 14px 20px;
    border-top: 1px solid #374151;
}

nav a:hover {
    background: #374151;
}

/* =========================
   PAGE
========================= */

.page {
    display: none;
    max-width: 1000px;
    margin: auto;
    padding: 25px 15px 60px;
}

.page.active {
    display: block;
}

.page-title {
    text-align: center;
    margin: 10px 0 25px;
    font-size: 28px;
}

/* =========================
   HOME
========================= */

.hero {
    background: white;
    border-radius: 15px;
    padding: 35px 20px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.hero h1 {
    margin-top: 0;
    font-size: 30px;
}

.hero p {
    color: #555;
    line-height: 1.6;
}

.home-button {
    border: none;
    background: #2563eb;
    color: white;
    padding: 13px 22px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
}

/* =========================
   CARDS
========================= */

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
}

.card p {
    color: #666;
    line-height: 1.5;
}

.view-button {
    width: 100%;
    border: none;
    background: #2563eb;
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
}

.view-button:hover {
    background: #1d4ed8;
}

/* =========================
   READER
========================= */

.reader-header {
    background: white;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.reader-header h1 {
    margin: 0 0 15px;
    font-size: 25px;
}

.back-button {
    border: none;
    background: #374151;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

#comic-pages {
    width: 100%;
}

.comic-image {
    display: block;
    width: 100%;
    max-width: 900px;
    height: auto;
    margin: 0 auto 15px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 25px 15px;
    background: #111827;
    color: #ddd;
    margin-top: 30px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .page {
        padding: 20px 12px 45px;
    }

    .page-title {
        font-size: 25px;
    }

    .hero h1 {
        font-size: 26px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .comic-image {
        width: 100%;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">

        <div class="logo">
            🌐 Website của tôi
        </div>

        <button class="menu-button" onclick="toggleMenu()">
            ☰
        </button>

    </div>

</header>

<nav id="main-menu">

    <a href="#" onclick="openPage('home')">
        🏠 Trang chủ
    </a>

    <a href="#" onclick="openPage('comic')">
        📚 Truyện tranh
    </a>

</nav>


<!-- =========================
     TRANG CHỦ
========================= -->

<section id="home" class="page">

    <div class="hero">

        <h1>🌐 Chào mừng bạn</h1>

        <p>
            Đây là website cá nhân của mình.
        </p>

        <p>
            Bạn có thể xem truyện tranh và các nội dung khác tại đây.
        </p>

        <button
            class="home-button"
            onclick="openPage('comic')"
        >
            📚 Xem truyện tranh
        </button>

    </div>

</section>


<!-- =========================
     TRUYỆN TRANH
========================= -->

<section id="comic" class="page">

    <h1 class="page-title">
        📚 Truyện Tranh
    </h1>

    <div class="cards">

        <!-- =====================
             DORAEMON
        ====================== -->

        <div class="card">

            <h2>
                🤖 Doraemon
            </h2>

            <p>
                Những câu chuyện vui nhộn
                của Doraemon và Nobita.
            </p>

            <button
                class="view-button"
                onclick="openComic('Doraemon')"
            >
                👉 Xem Truyện
            </button>

        </div>

    </div>

</section>


<!-- =========================
     TRANG ĐỌC TRUYỆN
========================= -->

<section id="reader" class="page">

    <div class="reader-header">

        <h1 id="reader-title">
            📖 Doraemon
        </h1>

        <button
            class="back-button"
            onclick="backToComic()"
        >
            ← Quay lại Truyện tranh
        </button>

    </div>

    <!--
    ==================================================
    ẢNH TRUYỆN SẼ ĐƯỢC JAVASCRIPT ĐƯA VÀO ĐÂY
    ==================================================
    -->

    <div id="comic-pages"></div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 Website của tôi

</footer>


<script>

/* ==================================================
   MỞ MENU
================================================== */

function toggleMenu() {

    const menu = document.getElementById("main-menu");

    menu.classList.toggle("active");

}


/* ==================================================
   LƯU TRANG
================================================== */

function savePage(page) {

    localStorage.setItem(
        "currentPage",
        page
    );

}


/* ==================================================
   MỞ TRANG
================================================== */

function openPage(page) {

    // Lưu trang hiện tại
    savePage(page);

    // Ẩn tất cả page
    document
        .querySelectorAll(".page")
        .forEach(function(element) {

            element.classList.remove("active");

        });


    // Hiện page được chọn
    const selectedPage =
        document.getElementById(page);

    if (selectedPage) {

        selectedPage.classList.add("active");

    }


    // Đóng menu
    document
        .getElementById("main-menu")
        .classList.remove("active");


    // Cuộn lên đầu
    window.scrollTo(0, 0);

}


/* ==================================================
   MỞ TRUYỆN
================================================== */

function openComic(name) {

    // Lưu tên truyện
    localStorage.setItem(
        "currentComic",
        name
    );


    // Lưu trang đang đọc
    savePage("reader");


    // Hiện trang reader
    document
        .querySelectorAll(".page")
        .forEach(function(page) {

            page.classList.remove("active");

        });


    document
        .getElementById("reader")
        .classList.add("active");


    // Đổi tiêu đề
    document
        .getElementById("reader-title")
        .innerText =
        "📖 " + name;


    /*
    ==================================================
    DANH SÁCH ẢNH TRUYỆN
    ==================================================

    4 ảnh bạn đã tải lên GitHub:

    img_00000.webp
    img_00001.webp
    img_00002.webp
    img_00003.webp

    SAU NÀY MUỐN THÊM ẢNH:

    "img_00004.webp",
    "img_00005.webp",

    chỉ cần thêm vào danh sách này.
    ==================================================
    */

    const comicImages = [

        "img_00000.webp",

        "img_00001.webp",

        "img_00002.webp",

        "img_00003.webp"

    ];


    // Khu vực ảnh
    const comicPages =
        document.getElementById(
            "comic-pages"
        );


    // Xóa ảnh cũ
    comicPages.innerHTML = "";


    // Thêm từng ảnh
    comicImages.forEach(
        function(image, index) {

            const img =
                document.createElement("img");


            img.src = image;


            img.alt =
                name +
                " - Trang " +
                (index + 1);


            img.className =
                "comic-image";


            img.loading = "lazy";


            comicPages.appendChild(img);

        }
    );


    // Cuộn lên đầu
    window.scrollTo(0, 0);

}


/* ==================================================
   QUAY LẠI TRUYỆN TRANH
================================================== */

function backToComic() {

    savePage("comic");

    openPage("comic");

}


/* ==================================================
   KHÔI PHỤC TRANG SAU KHI F5
================================================== */

window.addEventListener(
    "load",
    function() {

        const savedPage =
            localStorage.getItem(
                "currentPage"
            );


        const savedComic =
            localStorage.getItem(
                "currentComic"
            );


        /*
        ==============================================
        NẾU ĐANG ĐỌC TRUYỆN
        ==============================================
        */

        if (
            savedPage === "reader" &&
            savedComic
        ) {

            openComic(savedComic);

            return;

        }


        /*
        ==============================================
        NẾU ĐANG Ở TRUYỆN TRANH
        ==============================================
        */

        if (
            savedPage === "comic"
        ) {

            openPage("comic");

            return;

        }


        /*
        ==============================================
        MẶC ĐỊNH TRANG CHỦ
        ==============================================
        */

        openPage("home");

    }
);

</script>

</body>
</html>
